<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ウルトラマラソン ペース管理</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.4;
      -webkit-overflow-scrolling: touch;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
    }
    h1, h2, h3 { margin-top: 0; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .import-card { background: #e0f2fe; border: 1px solid #bae6fd; }
    .input-group { margin-bottom: 10px; }
    .input-group label {
      display: block; font-size: 0.85rem; margin-bottom: 3px; font-weight: bold;
    }
    input[type="text"], input[type="number"], input[type="datetime-local"], input[type="url"] {
      width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px;
      box-sizing: border-box; font-size: 16px;
    }
    .flex { display: flex; gap: 8px; align-items: center; }
    .flex-1 { flex: 1; }
    
    /* 2列グリッドレイアウト */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-box {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
    }
    .stat-label-sm {
      color: #64748b;
      font-size: 0.75rem;
      margin-bottom: 2px;
    }
    .stat-value-lg {
      font-weight: bold;
      font-size: 1.1rem;
      color: #0f172a;
    }

    button {
      background: var(--primary); color: white; border: none; padding: 10px;
      border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer;
      width: 100%; transition: background 0.2s;
    }
    button:active { opacity: 0.8; }
    button.danger { background: var(--danger); }
    button.success { background: var(--success); }
    button.secondary { background: #64748b; }
    
    #race-screen, #setup-screen, #loading-indicator { display: none; }
    
    /* コンパクト化された時計 */
    .clock-sm {
      font-size: 1.35rem; font-weight: bold; text-align: center;
      margin: 0; font-variant-numeric: tabular-nums; letter-spacing: 1px; color: #334155;
    }
    
    .status-ahead { color: var(--success); font-weight: bold; }
    .status-behind { color: var(--danger); font-weight: bold; }
    
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; } 
    .mb-4 { margin-bottom: 16px; } 
    .text-center { text-align: center; }
    
    .aid-row {
      border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #fafafa;
    }
    .aid-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: bold;}

    .badge {
      display: inline-flex; align-items: center; padding: 4px 10px;
      border-radius: 14px; font-size: 0.8rem; font-weight: bold; line-height: 1.2;
    }
    .badge-food { background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; }
    .badge-water { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

    /* 下部固定エリア */
    .bottom-action {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
      z-index: 100;
    }
    .btn-large {
      padding: 16px; font-size: 1.2rem; border-radius: 14px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }
    #setup-content { padding-bottom: 150px; }
    #race-content { padding-bottom: 165px; }

    .summary-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 6px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* グラフCanvasスタイル */
    #pace-chart {
      width: 100%;
      height: 160px;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 【設定画面】 -->
  <div id="setup-screen">
    <div id="setup-content">
      <h2 style="font-size: 1.3rem; margin-bottom: 12px;">大会プラン設定</h2>
      <div class="card import-card">
        <h3 style="color: #0369a1; margin-bottom: 6px; font-size: 1rem;">スプレッドシートから読込</h3>
        <p style="font-size: 0.75rem; color: #0c4a6e; margin-top: 0; margin-bottom: 8px;">共有URLを貼り付けてください。</p>
        <div class="input-group">
          <input type="url" id="sheet-url" placeholder="https://docs.google.com/spreadsheets/d/...">
        </div>
        <button onclick="loadFromSpreadsheet()" style="background: #0284c7;">↓ シートデータを反映する</button>
        <div id="loading-indicator" class="text-center mt-2" style="color: #0369a1; font-weight: bold; font-size: 0.85rem;">読み込み中...</div>
      </div>

      <div class="card">
        <div class="input-group" style="margin-bottom: 0;">
          <label>スタート予定日時</label>
          <input type="datetime-local" id="planned-start" onchange="updateSetupGoalSummary()">
        </div>
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h3 style="font-size: 1.1rem; margin: 0;">エイド（区間）設定</h3>
        <span style="font-size: 0.75rem; color: #64748b;">※手動修正可</span>
      </div>
      <div id="aid-list-container"></div>
      
      <button onclick="addAid()" class="secondary mb-4">＋ 次のエイドを手動追加</button>
    </div>

    <!-- 計画画面用 下部固定バー -->
    <div class="bottom-action">
      <div class="summary-box">
        <div>
          <div style="font-size: 0.7rem; color: #166534; font-weight: bold;">想定完走時間</div>
          <div id="setup-total-duration" style="font-size: 1rem; font-weight: bold; color: #15803d;">--時間--分</div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 0.7rem; color: #166534; font-weight: bold;">想定ゴール時刻</div>
          <div id="setup-goal-time" style="font-size: 1.1rem; font-weight: bold; color: #15803d;">--:--</div>
        </div>
      </div>
      <button onclick="startRace()" class="success btn-large">▶️ レースモードを開始する</button>
    </div>
  </div>

  <!-- 【レース画面】 -->
  <div id="race-screen">
    <div id="race-content">
      <!-- 1. コンパクトな現在時刻ヘッダー -->
      <div class="card text-center" style="padding: 6px 12px; margin-bottom: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #64748b; font-size: 0.8rem; font-weight: bold;">現在時刻</span>
          <span class="clock-sm" id="current-clock">--:--:--</span>
        </div>
      </div>

      <!-- 2. 次のエイド & 横並び区間情報 -->
      <div class="card" id="next-aid-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
          <h3 style="color: var(--primary); font-size: 1.35rem; margin: 0;" id="next-aid-title">---</h3>
          <div style="font-size: 0.9rem; color: #64748b; font-weight: bold;" id="disp-total-dist">累計 -- km</div>
        </div>
        
        <div style="margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap;" id="aid-features"></div>

        <div class="grid-2 mt-2">
          <div class="stat-box">
            <div class="stat-label-sm">区間距離</div>
            <div class="stat-value-lg" id="disp-section-dist">-- km</div>
          </div>
          <div class="stat-box">
            <div class="stat-label-sm">目標ペース</div>
            <div class="stat-value-lg" id="disp-pace">--:-- /km</div>
          </div>
        </div>
      </div>

      <!-- 3. 横並び 予定との差 & 到着予想 -->
      <div class="card" id="prediction-card">
        <div class="grid-2">
          <div class="stat-box">
            <div class="stat-label-sm">予定との差</div>
            <div class="stat-value-lg" id="disp-delay">--</div>
          </div>
          <div class="stat-box">
            <div class="stat-label-sm">到着予想時刻</div>
            <div class="stat-value-lg" id="disp-next-arrival">--:--</div>
          </div>
        </div>
      </div>

      <!-- 4. 📈 計画 vs 実績 折れ線グラフ -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <span style="font-size: 0.85rem; font-weight: bold; color: #334155;">📈 進行ペース（計画 vs 実績）</span>
          <span style="font-size: 0.7rem; color: #64748b;">点線:計画 / 実線:実績</span>
        </div>
        <canvas id="pace-chart"></canvas>
      </div>
    </div>

    <!-- レース画面用 下部固定バー -->
    <div class="bottom-action" id="bottom-action-area"></div>
  </div>
</div>

<script>
  let state = {
    plannedStart: "", 
    aids: [],
    actualTimes: []
  };

  window.onload = () => {
    const saved = localStorage.getItem('ultra-pace-state-v7');
    if (saved) {
      state = JSON.parse(saved);
    } else {
      let d = new Date();
      d.setDate(d.getDate() + 1);
      d.setHours(6, 0, 0, 0);
      state.plannedStart = d.toISOString().slice(0, 16);
      state.aids = [
        { name: "スタート", dist: 0, paceM: 0, paceS: 0, rest: 0, food: "", water: false },
        { name: "第1エイド", dist: 10.0, paceM: 6, paceS: 0, rest: 5, food: "おにぎり", water: false },
        { name: "ゴール", dist: 20.0, paceM: 6, paceS: 30, rest: 0, food: "", water: false }
      ];
    }
    
    const savedUrl = localStorage.getItem('ultra-pace-csv-url');
    if (savedUrl) document.getElementById('sheet-url').value = savedUrl;
    
    setInterval(updateClock, 1000);
    
    if (state.actualTimes.length > 0) showRaceScreen();
    else showSetupScreen();
  };

  function saveData() {
    localStorage.setItem('ultra-pace-state-v7', JSON.stringify(state));
    const url = document.getElementById('sheet-url').value;
    if(url) localStorage.setItem('ultra-pace-csv-url', url);
  }

  // ★ 改行・クォート対応CSVパーサー
  function parseCSV(text) {
    let rows = [];
    let quote = false;
    let row = [''];
    for (let c = 0; c < text.length; c++) {
      let cc = text[c];
      let nc = text[c+1] || '';
      if (cc === '"') {
        if (quote && nc === '"') { row[row.length - 1] += '"'; c++; }
        else { quote = !quote; }
      } else if (cc === ',' && !quote) {
        row.push('');
      } else if ((cc === '\r' || cc === '\n') && !quote) {
        if (cc === '\r' && nc === '\n') { c++; }
        rows.push(row);
        row = [''];
      } else {
        row[row.length - 1] += cc;
      }
    }
    if (row.length > 1 || row[0] !== '') {
      rows.push(row);
    }

    if (rows.length < 2) return [];

    const newAids = [];
    for (let i = 1; i < rows.length; i++) {
      const cols = rows[i];
      if (!cols || cols.length < 2) continue;
      
      const name = (cols[0] || '').trim();
      if (!name) continue;

      const dist = parseFloat(cols[1]) || 0;
      const paceM = parseInt(cols[2]) || 0;
      const paceS = parseInt(cols[3]) || 0;
      const rest = parseInt(cols[4]) || 0;
      const food = (cols[5] || '').trim();
      const waterVal = (cols[6] || '').trim();
      const water = (waterVal !== '' && waterVal !== '×' && waterVal !== 'なし');

      newAids.push({ name, dist, paceM, paceS, rest, food, water });
    }
    return newAids;
  }

  async function loadFromSpreadsheet() {
    let inputUrl = document.getElementById('sheet-url').value.trim();
    if (!inputUrl) { alert("URLを入力してください"); return; }
    
    document.getElementById('loading-indicator').style.display = 'block';
    
    let fetchUrl = inputUrl;
    if (inputUrl.includes('docs.google.com/spreadsheets')) {
      const match = inputUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) {
        const sheetId = match[1];
        if (!inputUrl.includes('output=csv')) {
          fetchUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;
        }
      }
    }

    try {
      const response = await fetch(fetchUrl);
      if (!response.ok) throw new Error("通信エラー");
      const text = await response.text();
      
      const newAids = parseCSV(text);
      
      if (newAids.length > 0) {
        state.aids = newAids; 
        saveData(); 
        renderAidSetup();
        alert(`スプレッドシートから全 ${newAids.length} 件のエイド情報を読み込みました！`);
      } else {
        alert("データの解析に失敗しました。ファイル形式を確認してください。");
      }
    } catch(e) {
      alert("読み込み失敗\n\n・スプレッドシートの「共有」設定が「リンクを知っている全員」になっているか確認してください。");
    } finally {
      document.getElementById('loading-indicator').style.display = 'none';
    }
  }

  function formatTimeHHMM(date) {
    if(!date) return "--:--";
    const h = date.getHours().toString().padStart(2, '0');
    const m = date.getMinutes().toString().padStart(2, '0');
    return `${h}:${m}`;
  }

  function paceToMs(m, s) { return (Number(m) * 60 + Number(s)) * 1000; }

  function getPlannedSchedule() {
    let currentMs = new Date(state.plannedStart || Date.now()).getTime();
    let schedule = [];
    for(let i = 0; i < state.aids.length; i++) {
      let aid = state.aids[i];
      if (i === 0) {
        schedule.push({ arrival: currentMs, departure: currentMs });
      } else {
        let prevAid = state.aids[i-1];
        let runTime = (aid.dist - prevAid.dist) * paceToMs(aid.paceM, aid.paceS);
        currentMs += runTime;
        let arrival = currentMs;
        if (i < state.aids.length - 1) {
          currentMs += (aid.rest * 60000);
        }
        let departure = currentMs;
        schedule.push({ arrival, departure });
      }
    }
    return schedule;
  }

  function updateSetupGoalSummary() {
    const startVal = document.getElementById('planned-start').value;
    if (startVal) state.plannedStart = startVal;
    
    if (!state.plannedStart || state.aids.length < 2) {
      document.getElementById('setup-goal-time').innerText = "--:--";
      document.getElementById('setup-total-duration').innerText = "--時間--分";
      return;
    }

    const schedule = getPlannedSchedule();
    const startMs = new Date(state.plannedStart).getTime();
    const goalMs = schedule[schedule.length - 1].arrival;
    
    const goalDate = new Date(goalMs);
    const totalDiffMs = goalMs - startMs;
    
    const totalMins = Math.floor(totalDiffMs / 60000);
    const h = Math.floor(totalMins / 60);
    const m = totalMins % 60;

    document.getElementById('setup-goal-time').innerText = formatTimeHHMM(goalDate);
    document.getElementById('setup-total-duration').innerText = `${h}時間${m.toString().padStart(2, '0')}分`;
  }

  function updateClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    const s = now.getSeconds().toString().padStart(2, '0');
    document.getElementById('current-clock').innerText = `${h}:${m}:${s}`;
  }

  function showSetupScreen() {
    document.getElementById('setup-screen').style.display = 'block';
    document.getElementById('race-screen').style.display = 'none';
    document.getElementById('planned-start').value = state.plannedStart;
    renderAidSetup();
  }

  function renderAidSetup() {
    const container = document.getElementById('aid-list-container');
    container.innerHTML = '';
    state.aids.forEach((aid, idx) => {
      const isStart = idx === 0;
      let html = `
        <div class="aid-row">
          <div class="aid-header">
            <span>${isStart ? 'スタート地点' : aid.name}</span>
            ${!isStart ? `<button style="width:auto; padding:4px 8px; background:var(--danger); font-size:0.8rem;" onclick="removeAid(${idx})">削除</button>` : ''}
          </div>
          <div class="input-group">
            <label>名称</label>
            <input type="text" value="${aid.name}" oninput="updateAid(${idx}, 'name', this.value)" ${isStart?'readonly':''}>
          </div>
          <div class="input-group">
            <label>累計距離 (km)</label>
            <input type="number" step="0.1" value="${aid.dist}" oninput="updateAid(${idx}, 'dist', this.value)" ${isStart?'readonly':''}>
          </div>
      `;
      if (!isStart) {
        html += `
          <div class="input-group">
            <label>区間の目標ペース (分:秒 /km)</label>
            <div class="flex">
              <input type="number" class="flex-1" value="${aid.paceM}" oninput="updateAid(${idx}, 'paceM', this.value)">分
              <input type="number" class="flex-1" value="${aid.paceS}" oninput="updateAid(${idx}, 'paceS', this.value)">秒
            </div>
          </div>
          <div class="input-group">
            <label>補給食メモ</label>
            <input type="text" value="${aid.food || ''}" oninput="updateAid(${idx}, 'food', this.value)">
          </div>
          <div class="input-group">
            <label style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" style="width:auto; transform: scale(1.3);" ${aid.water ? 'checked' : ''} onchange="updateAid(${idx}, 'water', this.checked)">
              水かぶりあり
            </label>
          </div>
        `;
      }
      html += `
          <div class="input-group">
            <label>${idx === state.aids.length - 1 ? 'ゴール後' : '休憩予定時間 (分)'}</label>
            <input type="number" value="${aid.rest}" oninput="updateAid(${idx}, 'rest', this.value)">
          </div>
        </div>
      `;
      container.innerHTML += html;
    });

    updateSetupGoalSummary();
  }

  function addAid() {
    const last = state.aids[state.aids.length - 1];
    state.aids.push({ name: `エイド${state.aids.length}`, dist: last.dist + 5, paceM: last.paceM || 6, paceS: last.paceS || 0, rest: 5, food: "", water: false });
    renderAidSetup();
  }

  function removeAid(idx) { 
    state.aids.splice(idx, 1); 
    renderAidSetup(); 
  }

  function updateAid(idx, field, value) {
    if(field === 'name' || field === 'food') state.aids[idx][field] = value;
    else if(field === 'water') state.aids[idx][field] = value;
    else state.aids[idx][field] = Number(value);
    
    saveData();
    updateSetupGoalSummary();
  }

  function startRace() {
    state.plannedStart = document.getElementById('planned-start').value;
    if(!state.plannedStart) { alert("スタート予定日時を入力してください"); return; }
    saveData(); showRaceScreen();
  }

  function showRaceScreen() {
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('race-screen').style.display = 'block';
    updateRaceDisplay();
  }

  function backToSetup() {
    if(confirm("設定画面に戻りますか？記録は消えません。")) showSetupScreen();
  }

  function resetRace() {
    if(confirm("タイム記録をリセットして、もう一度スタートから始めますか？")) {
      state.actualTimes = [];
      saveData();
      updateRaceDisplay();
    }
  }

  function recordDeparture() {
    const nextIdx = state.actualTimes.length;
    if (nextIdx >= state.aids.length) return;
    state.actualTimes.push(Date.now());
    saveData(); updateRaceDisplay();
  }

  function undoLast() {
    if (state.actualTimes.length === 0) return;
    if(confirm("直前の記録を取り消しますか？")) {
      state.actualTimes.pop(); saveData(); updateRaceDisplay();
    }
  }

  // ★ Canvas 計画 vs 実績 折れ線グラフ描画関数
  function drawChart() {
    const canvas = document.getElementById('pace-chart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    // Retinaディスプレイ対応
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    
    const width = rect.width;
    const height = rect.height;
    
    ctx.clearRect(0, 0, width, height);

    if (!state.aids || state.aids.length < 2) return;

    const schedule = getPlannedSchedule();
    const startMs = new Date(state.plannedStart || Date.now()).getTime();
    const lastAid = state.aids[state.aids.length - 1];
    const maxDist = lastAid.dist || 1;

    // 計画の全所要時間 (ms)
    const plannedTotalMs = schedule[schedule.length - 1].arrival - startMs;
    
    let maxTimeMs = plannedTotalMs;
    if (state.actualTimes.length > 0) {
      const lastActualMs = state.actualTimes[state.actualTimes.length - 1] - state.actualTimes[0];
      if (lastActualMs > maxTimeMs) maxTimeMs = lastActualMs;
    }
    if (maxTimeMs <= 0) maxTimeMs = 3600000;

    const padding = { top: 15, right: 15, bottom: 22, left: 40 };
    const graphWidth = width - padding.left - padding.right;
    const graphHeight = height - padding.top - padding.bottom;

    function getX(dist) {
      return padding.left + (dist / maxDist) * graphWidth;
    }
    function getY(ms) {
      return (height - padding.bottom) - (ms / maxTimeMs) * graphHeight;
    }

    // グリッド線と目盛り
    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    // Y軸（時間）目盛り
    const steps = 3;
    for (let i = 0; i <= steps; i++) {
      const ratio = i / steps;
      const y = (height - padding.bottom) - ratio * graphHeight;
      const mins = Math.round((maxTimeMs * ratio) / 60000);
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      const label = `${h}h${m > 0 ? m : ''}`;
      
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(width - padding.right, y);
      ctx.stroke();

      ctx.fillText(label, padding.left - 4, y);
    }

    // X軸（距離）目盛り
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const xSteps = 4;
    for (let i = 0; i <= xSteps; i++) {
      const ratio = i / xSteps;
      const x = padding.left + ratio * graphWidth;
      const distVal = (maxDist * ratio).toFixed(0);
      
      ctx.fillText(`${distVal}k`, x, height - padding.bottom + 4);
    }

    // 1. 計画線（点線）
    ctx.beginPath();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2;

    schedule.forEach((item, idx) => {
      const aid = state.aids[idx];
      const timeMs = item.arrival - startMs;
      const x = getX(aid.dist);
      const y = getY(timeMs);
      if (idx === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 2. 実績線（実線）
    if (state.actualTimes.length > 0) {
      const startActualMs = state.actualTimes[0];
      
      ctx.beginPath();
      ctx.setLineDash([]);
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 3;

      state.actualTimes.forEach((timeMs, idx) => {
        const aid = state.aids[idx];
        const elapsedMs = timeMs - startActualMs;
        const x = getX(aid.dist);
        const y = getY(elapsedMs);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // 実績プロット点
      state.actualTimes.forEach((timeMs, idx) => {
        const aid = state.aids[idx];
        const elapsedMs = timeMs - startActualMs;
        const x = getX(aid.dist);
        const y = getY(elapsedMs);
        
        ctx.beginPath();
        ctx.arc(x, y, idx === state.actualTimes.length - 1 ? 5 : 3.5, 0, Math.PI * 2);
        ctx.fillStyle = idx === state.actualTimes.length - 1 ? '#16a34a' : '#2563eb';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
    }
  }

  function updateRaceDisplay() {
    const nextIdx = state.actualTimes.length;
    const actionArea = document.getElementById('bottom-action-area');
    const schedule = getPlannedSchedule();

    // 【ゴール達成時】
    if (nextIdx >= state.aids.length) {
      document.getElementById('next-aid-title').innerText = "🎉 全行程フィニッシュ！";
      document.getElementById('disp-total-dist').innerText = `累計 ${state.aids[state.aids.length-1].dist} km`;
      document.getElementById('aid-features').innerHTML = `<span class="badge badge-food" style="font-size:0.9rem; padding:6px 12px;">🏆 完走おめでとうございます！</span>`;
      document.getElementById('disp-section-dist').innerText = "-- km";
      document.getElementById('disp-pace').innerText = "--:-- /km";
      document.getElementById('disp-delay').innerText = "完走";
      document.getElementById('disp-next-arrival').innerText = "--:--";
      
      actionArea.style.display = 'block';
      actionArea.innerHTML = `
        <div class="summary-box">
          <div>
            <div style="font-size: 0.7rem; color: #166534; font-weight: bold;">最終ゴール時刻</div>
            <div style="font-size: 1.1rem; font-weight: bold; color: #15803d;">${formatTimeHHMM(new Date(state.actualTimes[state.actualTimes.length-1]))}</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 0.7rem; color: #166534; font-weight: bold;">ステータス</div>
            <div style="font-size: 1rem; font-weight: bold; color: #15803d;">完走達成！</div>
          </div>
        </div>
        <button class="success btn-large" onclick="resetRace()">🔄 リセットして最初から走る</button>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button onclick="undoLast()" class="danger flex-1" style="padding: 8px; font-size: 0.85rem;">直前を戻す</button>
          <button onclick="backToSetup()" class="secondary flex-1" style="padding: 8px; font-size: 0.85rem;">設定画面へ</button>
        </div>
      `;
      drawChart();
      return;
    }

    // 下部固定エリアの構築
    let goalDateStr = "--:--";
    if (nextIdx === 0) {
      goalDateStr = formatTimeHHMM(new Date(schedule[schedule.length-1].arrival));
    } else {
      const lastActualDep = state.actualTimes[nextIdx - 1];
      let goalProjectedMs = lastActualDep;
      for (let i = nextIdx; i < state.aids.length; i++) {
        let d = state.aids[i].dist - state.aids[i-1].dist;
        goalProjectedMs += d * paceToMs(state.aids[i].paceM, state.aids[i].paceS);
        if (i !== state.aids.length - 1) goalProjectedMs += (state.aids[i].rest * 60000);
      }
      goalDateStr = formatTimeHHMM(new Date(goalProjectedMs));
    }

    actionArea.style.display = 'block';
    actionArea.innerHTML = `
      <div class="summary-box">
        <div>
          <div style="font-size: 0.7rem; color: #166534; font-weight: bold;">リアルタイム ゴール予想</div>
          <div style="font-size: 1.15rem; font-weight: bold; color: #15803d;">${goalDateStr}</div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 0.7rem; color: #64748b; font-weight: bold;">残り距離</div>
          <div style="font-size: 1rem; font-weight: bold; color: #0f172a;">${(state.aids[state.aids.length-1].dist - (nextIdx > 0 ? state.aids[nextIdx-1].dist : 0)).toFixed(1)} km</div>
        </div>
      </div>
      <button id="action-btn" class="success btn-large" onclick="recordDeparture()"></button>
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button onclick="undoLast()" class="danger flex-1" style="padding: 8px; font-size: 0.85rem;">戻す</button>
        <button onclick="backToSetup()" class="secondary flex-1" style="padding: 8px; font-size: 0.85rem;">設定へ</button>
      </div>
    `;

    const btn = document.getElementById('action-btn');
    
    // スタート前
    if (nextIdx === 0) {
      document.getElementById('next-aid-title').innerText = "スタート準備";
      document.getElementById('disp-total-dist').innerText = "累計 0.0 km";
      document.getElementById('aid-features').innerHTML = "";
      document.getElementById('disp-section-dist').innerText = "-- km";
      document.getElementById('disp-pace').innerText = "--:-- /km";
      document.getElementById('disp-delay').innerText = "--";
      document.getElementById('disp-next-arrival').innerText = "--:--";
      
      btn.innerText = "▶️ スタートする！";
      btn.className = "success btn-large";
      drawChart();
      return;
    }

    // 進行中
    const currentAid = state.aids[nextIdx];
    const prevAid = state.aids[nextIdx - 1];
    
    const sectionDist = currentAid.dist - prevAid.dist;
    const runTimeMs = sectionDist * paceToMs(currentAid.paceM, currentAid.paceS);
    
    const lastActualDep = state.actualTimes[nextIdx - 1];
    const lastPlannedDep = schedule[nextIdx - 1].departure;
    const diffMs = lastActualDep - lastPlannedDep; 
    const diffMins = Math.round(diffMs / 60000);
    
    let delayText = "予定通り";
    let prefix = (nextIdx === 1) ? "スタート" : "前回出発が";
    if (diffMins > 0) delayText = `<span class="status-behind">${prefix} ${diffMins}分 遅れ</span>`;
    if (diffMins < 0) delayText = `<span class="status-ahead">${prefix} ${Math.abs(diffMins)}分 早い</span>`;

    const arrivalExpectedMs = lastActualDep + runTimeMs;
    const nextArrivalDate = new Date(arrivalExpectedMs);

    document.getElementById('next-aid-title').innerText = currentAid.name;
    document.getElementById('disp-total-dist').innerText = `累計 ${currentAid.dist.toFixed(1)} km`;
    
    let badges = '';
    if (currentAid.food) badges += `<span class="badge badge-food">🍙 ${currentAid.food}</span>`;
    if (currentAid.water) badges += `<span class="badge badge-water">💧 水かぶり</span>`;
    document.getElementById('aid-features').innerHTML = badges;

    document.getElementById('disp-section-dist').innerText = `${sectionDist.toFixed(1)} km`;
    document.getElementById('disp-pace').innerText = `${currentAid.paceM}分${currentAid.paceS.toString().padStart(2, '0')}秒 /km`;
    document.getElementById('disp-delay').innerHTML = delayText;
    document.getElementById('disp-next-arrival').innerText = formatTimeHHMM(nextArrivalDate);

    if (nextIdx === state.aids.length - 1) {
      btn.innerText = `🏁 ゴールに到着！`;
      btn.className = "primary btn-large";
    } else {
      btn.innerText = `▶️ ${currentAid.name} を出発！`;
      btn.className = "success btn-large";
    }

    // グラフ描画
    drawChart();
  }

  // リサイズ時にもグラフを正しく再描画
  window.onresize = () => {
    if (document.getElementById('race-screen').style.display === 'block') {
      drawChart();
    }
  };
</script>
